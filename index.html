<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>riemann.world</title>
<style>
:root {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --hair: #2c2c2a; --border: rgba(255,255,255,0.10);
  --accent: #3987e5;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="light"] {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0efec;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --hair: #e1e0d9; --border: rgba(11,11,11,0.10);
  --accent: #2a78d6;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); overflow: hidden; overscroll-behavior: none; }
/* the page itself never pinch-zooms or double-tap-zooms: only the map does (scroll areas still pan) */
html { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; }
button, select, input, a { touch-action: manipulation; }
#app { display: grid; grid-template-columns: minmax(0, 1fr) 440px; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; }
#app.nopanel { grid-template-columns: minmax(0, 1fr) 0; }
header { min-width: 0; }
header { grid-column: 1 / 3; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--hair); background: var(--surface); min-height: 48px; flex-wrap: wrap; }
header h1 { font-size: 14px; font-weight: 600; margin: 0 6px 0 0; white-space: nowrap; }
header h1 a { color: inherit; text-decoration: none; }
@media (hover: hover) { header h1 a:hover { text-decoration: underline; } }
#btns { display: flex; gap: 8px; }
#colourwrap { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.short { display: none; }
#grab { display: none; }
#paper { font-size: 12px; color: var(--ink-2); text-decoration: none; white-space: nowrap; margin-right: 6px; }
#paper:hover { color: var(--ink); text-decoration: underline; }
.ctl { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
button.ctl { cursor: pointer; }
button.ctl:hover { border-color: var(--muted); }
#searchwrap { position: relative; }
#search { width: 300px; }
#results { position: absolute; top: 34px; left: 0; width: 540px; max-height: 60vh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 20; display: none; }
#results div { padding: 6px 10px; font-size: 12px; cursor: pointer; border-bottom: 1px solid var(--hair); word-break: break-all; }
#results div:hover, #results div.on { background: var(--surface-2); }
#results .sub { color: var(--muted); font-size: 11px; cursor: default; }
#results div .sub { padding: 0; border: 0; }
#legend { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
#legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
#legend .bar { width: 160px; height: 10px; border-radius: 5px; display: inline-block; vertical-align: -1px; margin: 0 4px; }
#stage { position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
canvas.drag { cursor: grabbing; }
.pill { background: color-mix(in srgb, var(--surface) 85%, transparent); border: 1px solid var(--border); border-radius: 6px; }
#crumbs { position: absolute; left: 12px; top: 10px; font-size: 12px; color: var(--ink-2); padding: 4px 8px; max-width: calc(100% - 24px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#crumbs a { color: var(--ink-2); cursor: pointer; text-decoration: none; }
#crumbs a:hover { color: var(--ink); text-decoration: underline; }
#status { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: var(--muted); padding: 2px 6px; }
#help { position: absolute; right: 12px; bottom: 10px; font-size: 11px; color: var(--muted); text-align: right; padding: 4px 8px; }
#tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 12px; max-width: 520px; box-shadow: 0 6px 18px rgba(0,0,0,.35); display: none; z-index: 30; }
#tip .t { font-weight: 600; word-break: break-all; }
#tip .m { color: var(--ink-2); margin-top: 2px; }
#tip pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; font-size: 11px; color: var(--ink-2); max-height: 160px; overflow: hidden; }
aside { position: relative; border-left: 1px solid var(--hair); background: var(--surface); overflow: auto; font-size: 13px; }
#app.nopanel aside { display: none; }
aside .sec { padding: 12px 14px; border-bottom: 1px solid var(--hair); }
aside h2 { font-size: 14px; margin: 0 0 4px; word-break: break-all; font-weight: 600; }
aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.stat .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11px; color: var(--muted); }
.list div { padding: 3px 0; cursor: pointer; word-break: break-all; font-size: 12px; color: var(--ink-2); }
.list div:hover { color: var(--ink); }
.list .n { color: var(--muted); font-variant-numeric: tabular-nums; float: right; margin-left: 8px; }
.chain div::before { content: "↳ "; color: var(--muted); }
.kind { display: inline-block; font-size: 10px; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-right: 6px; color: var(--ink-2); min-width: 30px; text-align: center; }
#src { margin: 0; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; overflow-x: auto; padding: 8px 0; background: var(--page); border-radius: 6px; }
#src .ln { display: inline-block; width: 46px; text-align: right; padding-right: 10px; color: var(--muted); user-select: none; }
#src .row.hl { background: color-mix(in srgb, var(--accent) 18%, transparent); }
#src .kw { color: var(--accent); font-weight: 600; }
#src .cm { color: var(--muted); font-style: italic; }
.note { color: var(--muted); font-size: 12px; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--page); font-size: 14px; color: var(--ink-2); z-index: 50; }
.x { float: right; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; }
@media (hover: none) { #help { display: none; } }
/* ---------- phones & small tablets: full-screen map, compact header, bottom sheet ---------- */
@media (max-width: 900px) {
  #app, #app.nopanel { grid-template-columns: minmax(0, 1fr); }
  header { grid-column: 1; position: relative; gap: 6px 8px; padding: calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 6px calc(8px + env(safe-area-inset-left)); min-height: 0; }
  header h1 { font-size: 16px; margin: 0; }
  .long { display: none; } .short { display: inline; }
  #paper { margin: 0; }
  #btns { margin-left: auto; gap: 6px; }
  #home { display: none; }          /* tapping the title does the same */
  #theme { min-width: 38px; font-size: 16px; padding: 4px 8px; }
  .ctl { font-size: 14px; padding: 6px 10px; }
  #searchwrap { position: static; order: 5; flex: 1 1 180px; min-width: 0; }
  #search { width: 100%; font-size: 16px; padding: 7px 10px; }   /* 16px stops iOS zooming on focus */
  #colourwrap { order: 6; }
  #mode { max-width: 40vw; font-size: 16px; padding: 6px 6px; }   /* 16px: no iOS focus zoom */
  #legend { order: 7; flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; scrollbar-width: none; font-size: 11px; gap: 10px; }
  #legend::-webkit-scrollbar { display: none; }
  #legend > span { flex: none; }
  #results { left: 8px; right: 8px; width: auto; top: 100%; max-height: 55vh; max-height: 55dvh; }
  #results div { padding: 10px 12px; font-size: 13px; }
  #crumbs { left: 8px; top: 8px; font-size: 11px; max-width: calc(100% - 16px); }
  #status { left: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); font-size: 10px; }
  #help { display: none; }
  html, body { position: fixed; inset: 0; }
  /* bottom sheet with three snap heights (set from JS via --sheet-h). Below full height the whole
     sheet is a drag surface; at full height its content scrolls and pulling down from the top shrinks it. */
  aside#sheet { position: fixed; left: 0; right: 0; bottom: 0; height: var(--sheet-h, 200px); border-left: 0; border-top: 1px solid var(--hair);
    border-radius: 14px 14px 0 0; box-shadow: 0 -8px 28px rgba(0,0,0,.28); z-index: 25; transition: height .3s cubic-bezier(.2,.9,.25,1);
    padding-bottom: env(safe-area-inset-bottom); overflow: hidden; touch-action: none; overscroll-behavior: contain; }
  aside#sheet.dragging { transition: none; }
  aside#sheet[data-state="full"] { overflow-y: auto; touch-action: pan-x pan-y; }
  #app:not(.nopanel) #status { display: none; }
  #grab { display: flex; justify-content: center; position: sticky; top: 0; background: var(--surface); padding: 10px 0 8px; z-index: 2; cursor: grab; touch-action: none; }
  #grab span { width: 40px; height: 5px; border-radius: 3px; background: var(--muted); opacity: .55; }
  aside .sec { padding: 10px 14px; }
  aside .sec:first-child { padding-top: 2px; }
  .list div { padding: 7px 0; font-size: 13px; }
  .x { font-size: 24px; padding: 0 2px 0 10px; }
  #src { font-size: 11px; }
  #tip { display: none !important; }
  #declcard .dname { font-size: 14px; font-weight: 600; margin: 2px 0 2px; word-break: break-all; }
  #declcard .in { font-size: 12px; color: var(--muted); margin-bottom: 6px; word-break: break-all; }
  #declcard pre { margin: 0; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; background: var(--page); border-radius: 6px; padding: 8px 10px; }
  #declcard .more { margin-top: 8px; color: var(--accent); font-size: 13px; cursor: pointer; }
}
#declcard { display: none; }
@media (max-width: 900px) { #declcard:not([hidden]) { display: block; } }
</style>
</head>
<body>
<div id="loading">Loading…</div>
<div id="app" class="nopanel">
  <header>
    <h1><a id="home-title" href="./" title="Back to the start">riemann.world</a></h1>
    <a id="paper" href="https://alpo.ge/remark.pdf" target="_blank" rel="noopener"><span class="long">Alpöge's Riemann proof</span><span class="short">the proof</span> ↗</a>
    <div id="searchwrap">
      <input id="search" class="ctl" placeholder="Search files, folders, declarations…  ( / )" autocomplete="off" spellcheck="false">
      <div id="results"></div>
    </div>
    <label id="colourwrap"><span class="long">Colour</span>
      <select id="mode" class="ctl" aria-label="Colour by">
        <option value="lib">Library</option>
        <option value="depth">Import distance from Main</option>
        <option value="indeg">Imported by (count)</option>
        <option value="thm">Share of theorems</option>
      </select>
    </label>
    <div id="btns">
      <button id="gomain" class="ctl" title="Jump to Main.lean">Main</button>
      <button id="home" class="ctl" title="Zoom out to everything (Esc)"><span class="long">Overview</span><span class="short">Zoom out</span></button>
      <button id="theme" class="ctl" title="Toggle light/dark" aria-label="Toggle light/dark"><span class="long">Light / dark</span><span class="short">◐</span></button>
    </div>
    <div id="legend"></div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="crumbs" class="pill"></div>
    <div id="status" class="pill"></div>
    <div id="help" class="pill">scroll to zoom · drag to pan · click to focus · Esc to go up<br>zoom into a file to see its declarations</div>
  </div>
  <aside id="sheet"><div id="grab" title="Expand / collapse"><span></span></div><div id="panel"></div></aside>
</div>
<div id="tip"></div>
<script src="d3-hierarchy.min.js"></script>
<script src="src/index.js"></script>
<script>
'use strict';
/* Data layout (all fetched on demand):
   map/skeleton.json  every folder + tile table (~100 KB gzipped, loaded at start)
   map/tNNNN.json     a tile: up to 1,500 neighbouring files (positions, stats)
   map/eNNNN.json     that tile's import edges, fetched when one of its files is selected
   search/sK.txt      search index, loaded when you first search
   src/bNNN.bin       gzip bundles of Lean source, loaded when a file's source is needed
   Node ids: folders are 0..D-1 (preorder); files are D..N-1, grouped by tile. */
const BSTART = window.SRCBUNDLES || [0];
let S, N, D, F;
let X, Y, R, PAR, TDEP, LOADED, NAME;           // all nodes
let DSIZE, DFILES, DLINES, DDECLS, DTHM, DDEPTH, DLIND, DTILES, LIB, MAXTDEP; // folders
let FID, FLINES, FDEPTH, FINDEG, FEXT, FNIMP, FCHAIN, KINDS, FIMP, FRIMP; // files (indexed by node id)
let ESTATE; const edgeWaiters = new Map(); // import edges per tile, fetched on selection
let DIRFILES;                                   // folder -> loaded direct file node ids
let TSTART, TCOUNT, TB, TMAXR, TSTATE, tilesLoaded = 0, bytesLoaded = 0;
const tileWaiters = new Map();

async function boot() {
  const r = await fetch('map/skeleton.json');
  const txt = await r.text(); bytesLoaded += txt.length;
  S = JSON.parse(txt);
  N = S.N; D = S.D; F = S.F;
  X = new Float64Array(N); Y = new Float64Array(N); R = new Float64Array(N);
  PAR = new Int32Array(N).fill(-1); TDEP = new Int32Array(N); LOADED = new Uint8Array(N); NAME = new Array(N);
  const d = S.dir;
  for (let i = 0; i < D; i++) { X[i] = d.x[i]; Y[i] = d.y[i]; R[i] = d.r[i]; PAR[i] = d.par[i]; NAME[i] = d.name[i]; LOADED[i] = 1; }
  for (let i = 1; i < D; i++) TDEP[i] = TDEP[PAR[i]] + 1;
  MAXTDEP = TDEP.reduce((a, b) => Math.max(a, b), 0) + 1;
  DSIZE = Int32Array.from(d.size); DFILES = d.files; DLINES = d.lines; DDECLS = d.decls; DTHM = d.thm; DDEPTH = d.depth; DLIND = d.lindeg; DTILES = d.tiles;
  LIB = new Int8Array(N);
  for (let i = 1; i < D; i++) { if (PAR[i] === 0) { const k = LIBNAMES.indexOf(NAME[i]); LIB[i] = k < 0 ? 7 : k; } else LIB[i] = LIB[PAR[i]]; }
  FID = new Int32Array(N).fill(-1); FLINES = new Int32Array(N); FDEPTH = new Int32Array(N); FINDEG = new Int32Array(N); FEXT = new Int32Array(N); FNIMP = new Int32Array(N); FCHAIN = new Int32Array(N).fill(-1);
  KINDS = new Array(N); FIMP = new Array(N); FRIMP = new Array(N);
  DIRFILES = Array.from({ length: D }, () => []);
  const T = S.tiles.length;
  TSTART = new Int32Array(T); TCOUNT = new Int32Array(T); TB = new Float64Array(T * 4); TMAXR = new Float64Array(T); TSTATE = new Uint8Array(T); ESTATE = new Uint8Array(T);
  S.tiles.forEach((t, k) => { TSTART[k] = t[0]; TCOUNT[k] = t[1]; TB[k * 4] = t[2]; TB[k * 4 + 1] = t[3]; TB[k * 4 + 2] = t[4]; TB[k * 4 + 3] = t[5]; TMAXR[k] = t[6]; });
  start();
}
function tileOf(n) { let lo = 0, hi = TSTART.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (TSTART[m] <= n) lo = m; else hi = m - 1; } return lo; }
function loadTile(k) {
  if (TSTATE[k] === 2) return Promise.resolve();
  if (tileWaiters.has(k)) return tileWaiters.get(k);
  TSTATE[k] = 1;
  const p = fetch(`map/t${String(k).padStart(4, '0')}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(txt => {
    bytesLoaded += txt.length;
    const t = JSON.parse(txt), s = TSTART[k];
    for (let j = 0; j < t.x.length; j++) {
      const n = s + j;
      X[n] = t.x[j]; Y[n] = t.y[j]; R[n] = t.r[j]; PAR[n] = t.par[j]; NAME[n] = t.name[j]; TDEP[n] = TDEP[PAR[n]] + 1;
      FID[n] = t.fid[j]; FLINES[n] = t.lines[j]; FDEPTH[n] = t.depth[j]; FINDEG[n] = t.indeg[j]; FEXT[n] = t.ext[j]; FNIMP[n] = t.nimp[j];
      KINDS[n] = t.kinds.slice(j * 5, j * 5 + 5);
      LOADED[n] = 1; DIRFILES[PAR[n]].push(n);
    }
    TSTATE[k] = 2; tilesLoaded++; tileWaiters.delete(k); requestDraw();
  }).catch(e => { TSTATE[k] = 0; tileWaiters.delete(k); console.warn('tile', k, e); });
  tileWaiters.set(k, p);
  return p;
}
function loadEdges(k) {
  if (ESTATE[k] === 2) return Promise.resolve();
  if (edgeWaiters.has(k)) return edgeWaiters.get(k);
  const p = fetch(`map/e${String(k).padStart(4, '0')}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(txt => {
    bytesLoaded += txt.length;
    const e = JSON.parse(txt), s = TSTART[k];
    for (let j = 0; j < e.imp.length; j++) { FIMP[s + j] = e.imp[j]; FRIMP[s + j] = e.rimp[j]; FCHAIN[s + j] = e.chain[j]; }
    ESTATE[k] = 2; edgeWaiters.delete(k); requestDraw();
  }).catch(e => { edgeWaiters.delete(k); console.warn('edges', k, e); });
  edgeWaiters.set(k, p);
  return p;
}
const ensureEdges = n => n < D ? Promise.resolve() : loadEdges(tileOf(n));
const ensureNode = n => (n < D || LOADED[n]) ? Promise.resolve() : loadTile(tileOf(n));
const ensureNodes = ns => Promise.all([...new Set(ns.filter(n => n >= D && !LOADED[n]).map(tileOf))].map(loadTile));
const ensureDirFiles = i => Promise.all(DTILES[i].map(loadTile));
const dirReady = i => DTILES[i].every(k => TSTATE[k] === 2);
const isFile = n => n >= D;
function dirPath(i) { const p = []; while (i > 0) { p.push(NAME[i]); i = PAR[i]; } return p.reverse(); }
function modOf(n) { return [...dirPath(PAR[n]), NAME[n]].join('.'); }
function nodePath(n) { return isFile(n) ? modOf(n) : dirPath(n).join('/'); }
function dirChildren(i) { const out = []; for (let c = i + 1; c < i + DSIZE[i]; c += DSIZE[c]) out.push(c); return out; }

// ---------- palette ----------
const LIBNAMES = ['Development', 'Formalism', 'GroundTheory', 'ReciprocityTheory', 'CompanionTheory', 'PositivityTheory', 'Lemmata'];
const LIBLABELS = [...LIBNAMES, 'Top level'];
// viridis (perceptually uniform, colour-blind safe); each theme drops the end that vanishes into its background
const VIRIDIS = ['#440154', '#482475', '#414487', '#355f8d', '#2a788e', '#21918c', '#22a884', '#44bf70', '#7ad151', '#bddf26', '#fde725'];
const PAL = {
  dark: { cat: ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#0ca30c', '#9085e9', '#e66767'],
          seq: ['#104281', '#184f95', '#1c5cab', '#256abf', '#2a78d6', '#3987e5', '#5598e7', '#6da7ec', '#86b6ef', '#9ec5f4', '#b7d3f6', '#cde2fb'],
          multi: VIRIDIS.slice(1),
          ink: '#f0efec', ink2: '#c3c2b7', muted: '#898781', bg: '#0d0d0d', surf: '#1a1a19', dirN: 'rgba(240,239,236,0.045)', ringN: 'rgba(240,239,236,0.16)' },
  light: { cat: ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'],
          seq: ['#104281', '#184f95', '#1c5cab', '#256abf', '#2a78d6', '#3987e5', '#5598e7', '#6da7ec', '#86b6ef', '#9ec5f4', '#b7d3f6', '#cde2fb'].reverse(),
          multi: VIRIDIS.slice(0, 10),
          ink: '#0b0b0b', ink2: '#52514e', muted: '#898781', bg: '#f9f9f7', surf: '#fcfcfb', dirN: 'rgba(11,11,11,0.035)', ringN: 'rgba(11,11,11,0.16)' },
};
let theme = (() => { try { return localStorage.getItem('riemann-world-theme'); } catch (e) { return null; } })()
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let mode = 'lib';
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function lum(hex) { const n = parseInt(hex.slice(1), 16); const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
// depth -> colour position by rank (histogram-equalised), so the busy 7-20 range spreads over the whole ramp
function depthT(dv) { const T = S.depthT; const a = Math.max(0, Math.min(T.length - 1, Math.floor(dv))), b = Math.min(T.length - 1, a + 1), f = dv - a; return T[a] + (T[b] - T[a]) * f; }
function ramp() { const P = PAL[theme]; return mode === 'depth' ? P.multi : P.seq; }
function rampHex(t) { const r = ramp(); return r[Math.max(0, Math.min(r.length - 1, Math.round(t * (r.length - 1))))]; }
// value in [0,1] for a node under the current mode
function nodeT(n) {

    <div class="in">line ${d.start + 1} · ${d.end - d.start} line${d.end - d.start === 1 ? '' : 's'} · in ${esc(NAME[selected])}</div>
    <pre>${shown.map(hlLine).join('\n')}${d.end - d.start > shown.length ? '\n…' : ''}</pre>
    <div class="more" id="declmore">Show it in the full source ↓</div>`;
  card.hidden = false;
  if (sheetState === 'peek') setSheet('half');
  sheet.scrollTop = 0;
  document.getElementById('declx').onclick = () => { card.hidden = true; selDecl = null; requestDraw(); };
  document.getElementById('declmore').onclick = () => { setSheet('full'); requestAnimationFrame(() => requestAnimationFrame(toRow)); };
}

// ---------- search (index fetched in shards on first use) ----------
const searchEl = document.getElementById('search'), resEl = document.getElementById('results');
let SIDX = [], sLoading = false, sLoaded = 0;
function loadSearch() {
  if (sLoading) return; sLoading = true;
  for (let k = 0; k < S.searchShards; k++) {
    fetch(`search/s${k}.txt`).then(r => r.text()).then(text => {
      bytesLoaded += text.length;
      const low = text.toLowerCase(), starts = [0];
      for (let i = text.indexOf('\n'); i >= 0; i = text.indexOf('\n', i + 1)) starts.push(i + 1);
      SIDX.push({ text, low, starts: Int32Array.from(starts) }); sLoaded++;
      if (searchEl.value.trim().length >= 2) runSearch();
    });
  }
}
let resList = [], resOn = 0, stimer = 0;
searchEl.addEventListener('focus', () => { loadSearch(); if (resList.length) resEl.style.display = 'block'; });
searchEl.addEventListener('input', () => { clearTimeout(stimer); stimer = setTimeout(runSearch, 120); });
searchEl.addEventListener('blur', () => setTimeout(() => resEl.style.display = 'none', 250));
searchEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { resOn = Math.min(resList.length - 1, resOn + 1); paintRes(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { resOn = Math.max(0, resOn - 1); paintRes(); e.preventDefault(); }
  else if (e.key === 'Enter' && resList[resOn] !== undefined) pick(resList[resOn]);
  else if (e.key === 'Escape') searchEl.blur();
});
function runSearch() {
  loadSearch();
  const q = searchEl.value.trim().toLowerCase();
  if (q.length < 2) { resList = []; resEl.style.display = 'none'; return; }
  const hits = [];
  for (const sh of SIDX) {
    let pos = sh.low.indexOf(q);
    while (pos >= 0 && hits.length < 4000) {
      let lo = 0, hi = sh.starts.length - 1;
      while (lo < hi) { const m = (lo + hi + 1) >> 1; if (sh.starts[m] <= pos) lo = m; else hi = m - 1; }
      const ls = sh.starts[lo], le = lo + 1 < sh.starts.length ? sh.starts[lo + 1] - 1 : sh.text.length;
      const line = sh.text.slice(ls, le), t1 = line.indexOf('\t'), t2 = line.indexOf('\t', t1 + 1), t3 = line.indexOf('\t', t2 + 1);
      const n = +line.slice(0, t1), did = +line.slice(t1 + 1, t2), name = line.slice(t2 + 1, t3), off = pos - ls;
      if (off > t2 && off < t3) {               // file name
        const l = name.toLowerCase(); hits.push({ n, did, name, s: l === q ? 0 : l.startsWith(q) ? 1 : 3 });
        pos = sh.low.indexOf(q, ls + t3);
      } else if (off > t3) {                    // declaration name
        let a = pos, b = pos + q.length;
        while (a > ls + t3 + 1 && sh.text[a - 1] !== ' ') a--;
        while (b < le && sh.text[b] !== ' ') b++;
        const dn = sh.text.slice(a, b), last = dn.slice(dn.lastIndexOf('.') + 1).toLowerCase();
        hits.push({ n, did, name, d: dn, s: last === q ? 0.5 : last.startsWith(q) ? 2 : 4 });
        pos = sh.low.indexOf(q, b);
      } else pos = sh.low.indexOf(q, pos + 1);
    }
  }
  const dirs = [];
  if (q.length >= 3) for (let i = 1; i < D && dirs.length < 8; i++) if (NAME[i].toLowerCase().includes(q)) dirs.push({ dir: i, s: NAME[i].toLowerCase() === q ? 0.2 : 1.5 });
  resList = [...hits, ...dirs].sort((a, b) => a.s - b.s || (a.d || a.name || '').length - (b.d || b.name || '').length).slice(0, 60);
  resOn = 0; paintRes();
}
function paintRes() {
  const hint = sLoaded < S.searchShards ? `<div class="sub">Loading search index (${sLoaded}/${S.searchShards}, ~8 MB, first search only)…</div>` : '';
  resEl.innerHTML = hint + (resList.length ? resList.map((r, k) => {
    const on = k === resOn ? 'on' : '';
    if (r.dir !== undefined) return `<div data-k="${k}" class="${on}"><span class="kind">folder</span>${esc(dirPath(r.dir).join('/'))}/</div>`;
    const mod = [...dirPath(r.did), r.name].join('.');
    if (r.d !== undefined) return `<div data-k="${k}" class="${on}"><span class="kind">decl</span>${esc(r.d)}<div class="sub">in ${esc(mod)}</div></div>`;
    return `<div data-k="${k}" class="${on}"><span class="kind">file</span>${esc(mod)}</div>`;
  }).join('') : (hint ? '' : '<div class="sub">No matches</div>'));
  resEl.style.display = 'block';
  const on = resEl.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' });
}
resEl.addEventListener('mousedown', e => e.preventDefault());
resEl.addEventListener('click', e => { const t = e.target.closest('[data-k]'); if (t) pick(resList[+t.dataset.k]); });
function pick(r) { resEl.style.display = 'none'; searchEl.blur(); select(r.dir !== undefined ? r.dir : r.n, { fly: true, declName: r.d }); }

// ---------- controls + boot ----------
document.getElementById('mode').addEventListener('change', e => { mode = e.target.value; recolor(); });
document.getElementById('home').onclick = () => flyTo(0);
document.getElementById('home-title').onclick = e => { e.preventDefault(); closePanel(); searchEl.value = ''; resList = []; flyTo(0); updateCrumbs(); };
document.getElementById('gomain').onclick = () => select(S.mainNode, { fly: true });
document.getElementById('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('riemann-world-theme', theme); } catch (e) {} recolor(); if (selected >= 0) renderPanel(selected); };
window.addEventListener('resize', resize);
async function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h.startsWith('m=') && !h.startsWith('d=')) return;
  const parts = h.startsWith('m=') ? h.slice(2).split('.') : h.slice(2).split('/');
  let i = 0, k = 0;
  for (; k < parts.length; k++) { const c = dirChildren(i).find(c => NAME[c] === parts[k]); if (c === undefined) break; i = c; }
  // the rest of a module name is a file inside folder i (file names never contain dots)
  if (k < parts.length && h.startsWith('m=')) { await ensureDirFiles(i); const f = DIRFILES[i].find(f => NAME[f] === parts.slice(k).join('.')); if (f !== undefined) i = f; }
  cam = { x: X[i], y: Y[i], k: fitK(i, isFile(i) ? 0.62 : 0.92) };
  select(i, { fly: true });
}
function start() {
  recolor(); resize();
  document.getElementById('loading').remove();
  updateCrumbs(); fromHash();
}
boot().catch(e => { document.getElementById('loading').textContent = location.protocol === 'file:' ? 'Open this page over http — GitHub Pages, or run “python3 -m http.server” in this folder.' : 'Failed to load: ' + e; });
</script>
